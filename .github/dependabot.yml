# Weekly upgrade PRs, grouped so they arrive as a handful rather than dozens.
# Each one runs through the full CI pipeline before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(api)'
    ignore:
      # A NestJS major is a migration (Express 5 and friends), done on purpose
      # with every @nestjs package at once. A security update once bumped half
      # of them to 12 and left the rest on 10, which cannot even install.
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      nestjs-security:
        applies-to: security-updates
        patterns: ['@nestjs/*']
      api-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(dashboard)'
    groups:
      dashboard-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'deps(docker)'
